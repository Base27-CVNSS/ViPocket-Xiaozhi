name: CI and Windows Portable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vipocket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify single server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependency
        run: npm install --omit=dev --no-audit --no-fund

      - name: Syntax and unit tests
        run: npm run check

      - name: Smoke-test website and health API
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          npm start > "$RUNNER_TEMP/vipocket-linux.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > "$RUNNER_TEMP/index.html" \
              && curl --fail --silent --show-error http://127.0.0.1:5173/health > "$RUNNER_TEMP/health.json" \
              && curl --fail --silent --show-error http://127.0.0.1:5173/src/main.js > "$RUNNER_TEMP/main.js"; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/vipocket-linux.log"
            exit 1
          fi

          grep -q 'ViPocket Xiaozhi' "$RUNNER_TEMP/index.html"
          grep -q 'vipocket-standalone' "$RUNNER_TEMP/health.json"
          grep -q 'ViPocket 2.2 initialized' "$RUNNER_TEMP/main.js"

  windows-portable:
    name: Build and test Windows portable
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PowerShell launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts\windows-one-click.ps1', 'scripts\windows-stop.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error in $file"
            }
          }

      - name: Install production dependency and test
        shell: pwsh
        run: |
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble Windows portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $PWD 'release'
          $stage = Join-Path $releaseRoot 'ViPocket-Xiaozhi'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          & robocopy . $stage /E /XD .git .github node_modules release .vipocket logs runtime /XF .env *.log | Out-Host
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with code $LASTEXITCODE" }

          Copy-Item (Join-Path $PWD 'node_modules') (Join-Path $stage 'node_modules') -Recurse -Force

          $nodeVersion = (& node -p 'process.versions.node').Trim()
          $nodeZip = "node-v$nodeVersion-win-x64.zip"
          $nodeUrl = "https://nodejs.org/dist/v$nodeVersion/$nodeZip"
          $nodeZipPath = Join-Path $releaseRoot $nodeZip
          $nodeExtract = Join-Path $releaseRoot 'node-extract'
          Invoke-WebRequest -UseBasicParsing -Uri $nodeUrl -OutFile $nodeZipPath
          Expand-Archive $nodeZipPath $nodeExtract -Force
          $runtimeFolder = Get-ChildItem $nodeExtract -Directory | Select-Object -First 1
          if (-not $runtimeFolder) { throw 'Node.js runtime folder was not found.' }
          Move-Item $runtimeFolder.FullName (Join-Path $stage 'runtime')

          @"
          ViPocket-Xiaozhi Windows Portable 2.2.0
          Commit: $env:GITHUB_SHA
          Node.js: $nodeVersion

          Double-click START-VIPOCKET.cmd.
          Website and gateway share http://127.0.0.1:5173.
          Git, Node.js installation, and npm install are not required.
          "@ | Set-Content (Join-Path $stage 'PORTABLE-BUILD.txt') -Encoding UTF8

      - name: Smoke-test assembled portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          Copy-Item (Join-Path $stage '.env.example') (Join-Path $stage '.env') -Force
          $node = Join-Path $stage 'runtime\node.exe'
          $entry = Join-Path $stage 'apps\gateway\src\standalone.mjs'
          $log = Join-Path $stage 'portable-smoke.log'
          $command = '"{0}" "{1}" 1>>"{2}" 2>&1' -f $node, $entry, $log
          $process = Start-Process cmd.exe -ArgumentList @('/d', '/c', $command) -WorkingDirectory $stage -WindowStyle Hidden -PassThru

          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/' -TimeoutSec 2
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5173/health' -TimeoutSec 2
                $main = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5173/src/main.js' -TimeoutSec 2
                if (
                  $page.StatusCode -eq 200 -and
                  $page.Content -match 'ViPocket Xiaozhi' -and
                  $health.service -eq 'vipocket-standalone' -and
                  $main.Content -match 'ViPocket 2.2 initialized'
                ) {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              if (Test-Path $log) { Get-Content $log -Tail 100 | Out-Host }
              throw 'Windows portable smoke test failed.'
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          Remove-Item (Join-Path $stage '.env') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'portable-smoke.log') -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $PWD 'release\ViPocket-Xiaozhi-Windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created.' }

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ViPocket-Xiaozhi-Windows-x64
          path: release/ViPocket-Xiaozhi-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        permissions:
          contents: write
        with:
          generate_release_notes: true
          files: release/ViPocket-Xiaozhi-Windows-x64.zip

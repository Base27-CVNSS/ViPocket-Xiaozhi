name: Build Windows Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vipocket-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check apps/gateway/src/config.mjs
          node --check apps/gateway/src/index.mjs
          node --check apps/gateway/src/activation-service.mjs
          node --check apps/gateway/src/session-store.mjs
          node --check apps/web/src/main.js
          node --check apps/web/src/audio/voice-engine.js

      - name: Run gateway tests
        run: npm test

      - name: Build production website
        run: npm run build

      - name: Smoke-test website and gateway
        shell: bash
        run: |
          cp .env.example .env
          node apps/gateway/src/index.mjs > /tmp/vipocket.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/index.html \
              && curl --fail --silent --show-error http://127.0.0.1:8787/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/vipocket.log
            exit 1
          fi
          grep -q 'ViPocket' /tmp/index.html
          grep -q 'vipocket-gateway' /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-log
          path: /tmp/vipocket.log
          if-no-files-found: ignore
          retention-days: 7

  windows-portable:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts\windows-one-click.ps1', 'scripts\windows-stop.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error: $file"
            }
          }

      - name: Install, test and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build failed' }

      - name: Assemble self-contained folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $PWD 'release'
          $stage = Join-Path $releaseRoot 'ViPocket-Xiaozhi'
          $sourceZip = Join-Path $releaseRoot 'source.zip'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          git archive --format=zip --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $stage -Force

          $stageDist = Join-Path $stage 'apps\web\dist'
          New-Item -ItemType Directory -Force -Path $stageDist | Out-Null
          Copy-Item -Path (Join-Path $PWD 'apps\web\dist\*') -Destination $stageDist -Recurse -Force

          $stageModules = Join-Path $stage 'node_modules'
          New-Item -ItemType Directory -Force -Path $stageModules | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'node_modules\ws') -Destination (Join-Path $stageModules 'ws') -Recurse -Force

          $nodeDirectory = Split-Path (Get-Command node.exe).Source
          $stageRuntime = Join-Path $stage 'runtime'
          New-Item -ItemType Directory -Force -Path $stageRuntime | Out-Null
          Copy-Item -Path (Join-Path $nodeDirectory '*') -Destination $stageRuntime -Recurse -Force

          @"
          ViPocket-Xiaozhi Windows Portable 2.2.0
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format o)

          1. Extract the complete ZIP.
          2. Double-click START-VIPOCKET.cmd.
          3. Open http://127.0.0.1:8787/ if the browser does not open automatically.
          "@ | Set-Content -LiteralPath (Join-Path $stage 'PORTABLE-BUILD.txt') -Encoding UTF8

      - name: Smoke-test assembled Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          Copy-Item -LiteralPath (Join-Path $stage '.env.example') -Destination (Join-Path $stage '.env') -Force
          $node = Join-Path $stage 'runtime\node.exe'
          $entry = Join-Path $stage 'apps\gateway\src\index.mjs'
          $log = Join-Path $stage 'portable-smoke.log'
          $command = '"{0}" "{1}" 1>>"{2}" 2>&1' -f $node, $entry, $log
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d', '/c', $command) -WorkingDirectory $stage -WindowStyle Hidden -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { break }
              try {
                $web = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/' -TimeoutSec 2
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
                if ($web.StatusCode -eq 200 -and $web.Content -match 'ViPocket' -and $health.ok -eq $true) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              if (Test-Path $log) { Get-Content $log -Tail 120 | Out-Host }
              throw 'The assembled Windows package did not start correctly.'
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          Remove-Item (Join-Path $stage '.env') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'portable-smoke.log') -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $PWD 'release\ViPocket-Xiaozhi-Windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created.' }
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-Host

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPocket-Xiaozhi-Windows-x64
          path: release/ViPocket-Xiaozhi-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish stable one-click release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $PWD 'release\ViPocket-Xiaozhi-Windows-x64.zip'
          $tag = 'windows-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update release asset.' }
          } else {
            gh release create $tag $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'ViPocket-Xiaozhi Windows Portable' `
              --notes 'Stable one-click Windows x64 package. Extract the ZIP and double-click START-VIPOCKET.cmd.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create Windows release.' }
          }

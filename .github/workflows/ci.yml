name: Build Windows Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vipocket-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check apps/gateway/src/config.mjs
          node --check apps/gateway/src/index.mjs
          node --check apps/gateway/src/activation-service.mjs
          node --check apps/gateway/src/session-store.mjs
          node --check apps/web/src/bootstrap.js
          node --check apps/web/src/main.js
          node --check apps/web/src/audio/voice-engine.js

      - name: Run gateway tests
        run: npm test

      - name: Build production website
        run: npm run build

      - name: Smoke-test website and zero-config gateway
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          node apps/gateway/src/index.mjs > /tmp/vipocket.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/index.html \
              && curl --fail --silent --show-error http://127.0.0.1:8787/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/vipocket.log
            exit 1
          fi
          grep -q 'ViPocket' /tmp/index.html
          grep -q 'v2.3.0' /tmp/index.html
          grep -q 'vipocket-gateway' /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"activationConfigured":true' /tmp/health.json

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-log
          path: /tmp/vipocket.log
          if-no-files-found: ignore
          retention-days: 7

  windows-portable:
    name: Package Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts\windows-one-click.ps1', 'scripts\windows-stop.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error: $file"
            }
          }

      - name: Install, test and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build failed' }

      - name: Assemble self-contained folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $PWD 'release'
          $stage = Join-Path $releaseRoot 'ViPocket-Xiaozhi'
          $sourceZip = Join-Path $releaseRoot 'source.zip'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          git archive --format=zip --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $stage -Force

          $stageDist = Join-Path $stage 'apps\web\dist'
          New-Item -ItemType Directory -Force -Path $stageDist | Out-Null
          Copy-Item -Path (Join-Path $PWD 'apps\web\dist\*') -Destination $stageDist -Recurse -Force

          $stageModules = Join-Path $stage 'node_modules'
          New-Item -ItemType Directory -Force -Path $stageModules | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'node_modules\ws') -Destination (Join-Path $stageModules 'ws') -Recurse -Force

          $nodeDirectory = Split-Path (Get-Command node.exe).Source
          $stageRuntime = Join-Path $stage 'runtime'
          New-Item -ItemType Directory -Force -Path $stageRuntime | Out-Null
          Copy-Item -Path (Join-Path $nodeDirectory '*') -Destination $stageRuntime -Recurse -Force

          @"
          ViPocket-Xiaozhi Windows Portable 2.3.0
          Commit: $env:GITHUB_SHA
          Built: $(Get-Date -Format o)
          Default upstream: Xiaozhi Official Cloud (OTA auto mode)

          1. Extract the complete ZIP.
          2. Double-click START-VIPOCKET.cmd.
          3. Open http://127.0.0.1:8787/ if the browser does not open automatically.
          4. Click Request activation code and enter it in Xiaozhi Console.
          "@ | Set-Content -LiteralPath (Join-Path $stage 'PORTABLE-BUILD.txt') -Encoding UTF8

      - name: Smoke-test assembled one-click launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          $launcher = Join-Path $stage 'scripts\windows-one-click.ps1'
          $stopper = Join-Path $stage 'scripts\windows-stop.ps1'

          try {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser
            if ($LASTEXITCODE -ne 0) {
              throw "One-click launcher failed with exit code $LASTEXITCODE."
            }

            $web = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/' -TimeoutSec 5
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 5
            if (
              $web.StatusCode -ne 200 -or
              $web.Content -notmatch 'ViPocket' -or
              $web.Content -notmatch 'v2.3.0' -or
              $health.ok -ne $true -or
              $health.activationConfigured -ne $true
            ) {
              throw 'The assembled one-click package did not pass zero-config health checks.'
            }
          } finally {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $stopper
          }

      - name: Upload portable logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-failure-logs
          path: |
            release/ViPocket-Xiaozhi/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release\ViPocket-Xiaozhi'
          Remove-Item (Join-Path $stage '.env') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage '.vipocket') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'logs') -Recurse -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $PWD 'release\ViPocket-Xiaozhi-Windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created.' }
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-Host

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPocket-Xiaozhi-Windows-x64
          path: release/ViPocket-Xiaozhi-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish stable one-click release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $PWD 'release\ViPocket-Xiaozhi-Windows-x64.zip'
          $tag = 'windows-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update release asset.' }
          } else {
            gh release create $tag $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'ViPocket-Xiaozhi Windows Portable 2.3' `
              --notes 'One-click Windows x64 package with Xiaozhi Official Cloud enabled by default. Extract the ZIP, double-click START-VIPOCKET.cmd, and request the real activation code.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create Windows release.' }
          }

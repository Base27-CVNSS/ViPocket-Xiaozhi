name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Test gateway
        run: npm test

      - name: Build web
        run: npm run build

      - name: Create Windows one-click package
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p release/ViPocket-Xiaozhi
          rsync -a ./ release/ViPocket-Xiaozhi/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'release' \
            --exclude '.env' \
            --exclude '.vipocket' \
            --exclude 'logs'
          cd release
          zip -r -9 ViPocket-Xiaozhi-Windows-OneClick.zip ViPocket-Xiaozhi

      - name: Upload Windows one-click package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ViPocket-Xiaozhi-Windows-OneClick
          path: release/ViPocket-Xiaozhi-Windows-OneClick.zip
          if-no-files-found: error
          retention-days: 30
